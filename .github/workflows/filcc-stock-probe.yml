name: Fil-CC stock preflight
on:
  push:
    branches: [codex/fil-cc-stock-probe]
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ecd52bf6570a7a8ecad48b9a04df0db3581a9f9
          sparse-checkout: filcc
      - name: Verify the native and stock runtime oracles
        run: |
          bash filcc/install.sh "$(command -v clang)" "$RUNNER_TEMP/stock"
          filcc/tests/run.sh clang
          filcc/tests/run.sh "$RUNNER_TEMP/stock/build/bin/clang"
