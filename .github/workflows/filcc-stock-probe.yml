name: Fil-CC integrated runtime stress
on:
  push:
    branches: [codex/fil-cc-stock-probe]
permissions:
  actions: read
  contents: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca20f8d3fa46eb42dd172725d1a0904515c78a33
          sparse-checkout: |
            benchmarkData
            filcc
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45926650575
          name: filcc-clang-linux-x86_64
          path: package
      - name: Verify ABI, C++ support, PHIs, and concurrent collection
        run: |
          (cd package && tar -xJf filcc-clang-linux-x86_64.tar.xz)
          bash filcc/install.sh package/clang-20 "$RUNNER_TEMP/stock"
          stock="$RUNNER_TEMP/stock/build/bin/clang"
          filcc="$RUNNER_TEMP/stock/build/bin/filcc-clang"
          "$filcc" --version
          filcc/tests/run.sh "$stock" -march=native
          filcc/tests/run.sh "$filcc" -march=native -mllvm -filcc-batch-reads
          "$filcc" -O3 -march=native -I filcc -mllvm -filcc-batch-reads -mllvm -filc-light-verbose \
            -S -emit-llvm filcc/tests/regress.c -o "$RUNNER_TEMP/regress.ll" 2>"$RUNNER_TEMP/regress.log"
          grep 'filcc.batch' "$RUNNER_TEMP/regress.log" >/dev/null
          grep 'load <4 x i16>' "$RUNNER_TEMP/regress.log"
          grep 'load <4 x i64>' "$RUNNER_TEMP/regress.log"
          cat >"$RUNNER_TEMP/smoke.cpp" <<'EOF'
          #include <array>
          #include <cstdint>
          #include <span>
          __attribute__((noinline))
          std::uint64_t total(const std::uint32_t *data, std::size_t size) {
              std::uint64_t n = 0;
              for (std::size_t i = 0; i != size; ++i)
                  n += data[i];
              return n;
          }
          int main() {
              auto values = std::array<std::uint32_t, 9>{1,2,3,4,5,6,7,8,9};
              auto view = std::span(values);
              return total(view.data(), view.size()) == 45 ? 0 : 1;
          }
          EOF
          "$filcc" --driver-mode=g++ -std=c++20 -O3 -mllvm -filcc-batch-reads \
            "$RUNNER_TEMP/smoke.cpp" -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke"
