name: Fil-CC ORC compilation-cost probe
on:
  push:
    branches: [codex/fil-cc-stock-probe]
permissions:
  contents: read
jobs:
  jit-cost:
    runs-on: ubuntu-24.04
    steps:
      - name: Time native-only ORC materialization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-20-dev
          cat >orc-probe.cpp <<'EOF'
          #include "llvm/ExecutionEngine/Orc/LLJIT.h"
          #include "llvm/IR/IRBuilder.h"
          #include "llvm/Support/TargetSelect.h"
          #include <algorithm>
          #include <chrono>
          #include <cstdint>
          #include <cstdio>
          #include <vector>

          using namespace llvm;
          using Clock = std::chrono::steady_clock;

          int main() {
            InitializeNativeTarget();
            InitializeNativeTargetAsmPrinter();
            ExitOnError unwrap;
            const auto init = Clock::now();
            auto jit = unwrap(orc::LLJITBuilder().create());
            const auto startup = std::chrono::duration_cast<std::chrono::nanoseconds>(
              Clock::now() - init).count();
            std::vector<long long> results;
            for (int iteration = 0; iteration != 34; ++iteration) {
              auto context = std::make_unique<LLVMContext>();
              auto module = std::make_unique<Module>("callback", *context);
              module->setDataLayout(jit->getDataLayout());
              IRBuilder<> b(*context);
              auto *type = FunctionType::get(b.getInt32Ty(), {b.getInt32Ty()}, false);
              std::string name = "clamp_" + std::to_string(iteration);
              auto *function = Function::Create(type, GlobalValue::ExternalLinkage, name, *module);
              b.SetInsertPoint(BasicBlock::Create(*context, "entry", function));
              b.CreateRet(b.CreateAnd(function->getArg(0), b.getInt32(255)));
              const auto start = Clock::now();
              unwrap(jit->addIRModule(orc::ThreadSafeModule(std::move(module), std::move(context))));
              auto code = unwrap(jit->lookup(name));
              const auto elapsed = std::chrono::duration_cast<std::chrono::nanoseconds>(
                Clock::now() - start).count();
              if (code.toPtr<std::uint32_t (*)(std::uint32_t)>()(123456) != (123456 & 255))
                return 1;
              if (iteration >= 3)
                results.push_back(elapsed);
            }
            std::sort(results.begin(), results.end());
            std::printf("startup_ns %lld\n", static_cast<long long>(startup));
            std::printf("materialization_ns min=%lld median=%lld p90=%lld max=%lld\n",
              results.front(), results[15], results[27], results.back());
            for (long long sample : results) std::printf("sample_ns %lld\n", sample);
          }
          EOF
          clang++ $(llvm-config-20 --cxxflags) -O2 orc-probe.cpp \
            $(llvm-config-20 --ldflags --link-shared --libs orcjit native --system-libs) -o orc-probe
          lscpu | sed -n -e '/Model name:/p'
          allowed=$(sed -n 's/^Cpus_allowed_list:[[:space:]]*//p' /proc/self/status)
          taskset -c "${allowed%%[-,]*}" ./orc-probe
