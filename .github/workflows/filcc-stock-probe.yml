name: Fil-CC stock preflight
on:
  push:
    branches: [codex/fil-cc-stock-probe]
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ecd52bf6570a7a8ecad48b9a04df0db3581a9f9
          sparse-checkout: |
            benchmarkData
            filcc
            llvm/lib/Transforms/Instrumentation
      - name: Verify the exact pass with a standalone LLVM IR round trip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-20-dev
          bash filcc/install.sh "$(command -v clang)" "$RUNNER_TEMP/stock"
          stock="$RUNNER_TEMP/stock/build/bin/clang"
          dir=llvm/lib/Transforms/Instrumentation
          mkdir preflight
          cat >preflight/rewrite.cpp <<'EOF'
          #include "FilCCBatchReads.h"
          #include "llvm/IR/Module.h"
          #include "llvm/IR/Verifier.h"
          #include "llvm/IRReader/IRReader.h"
          #include "llvm/Support/SourceMgr.h"
          #include "llvm/Support/raw_ostream.h"
          using namespace llvm;
          int main(int argc, char **argv) {
            if (argc != 2) return 2;
            SMDiagnostic error;
            LLVMContext context;
            auto module = parseIRFile(argv[1], error, context);
            if (!module) { error.print(argv[0], errs()); return 1; }
            if (verifyModule(*module, &errs())) return 1;
            for (Function &function : *module) filccBatchReads(function);
            if (verifyModule(*module, &errs())) return 1;
            module->print(outs(), nullptr);
          }
          EOF
          clang++ $(llvm-config-20 --cxxflags) -I"$dir" preflight/rewrite.cpp "$dir/FilCCBatchReads.cpp" \
            $(llvm-config-20 --ldflags --link-shared --libs core irreader transformutils --system-libs) -o preflight/rewrite
          for name in kernels regress; do
            if [[ "$name" == regress ]]; then source=filcc/tests/regress.c; else source=filcc/kernels.c; fi
            "$stock" -O3 -march=native -I filcc -mllvm -filc-light-verbose -S -emit-llvm "$source" \
              -o "preflight/original-$name.ll" 2>"preflight/trace-$name.log"
            awk 'NR == 1 {next} /^Here.s the pizlonated module/ {exit} !/^target datalayout_after_filc / {sub(/-ni:0-/, "-"); print}' \
              "preflight/trace-$name.log" >"preflight/input-$name.ll"
            preflight/rewrite "preflight/input-$name.ll" >"preflight/rewritten-$name.ll"
            grep -E 'load <4 x i(8|16|32|64)>' "preflight/rewritten-$name.ll"
            layout=$(grep -m 1 '^target datalayout_after_filc ' "preflight/trace-$name.log")
            sed -e "1a $layout" -e '/^target datalayout = /s/e-m:e-/e-m:e-ni:0-/' "preflight/rewritten-$name.ll" >"preflight/filc-$name.ll"
            "$stock" -O3 -march=native -c "preflight/filc-$name.ll" -o "preflight/$name.o"
          done
          "$stock" -O3 preflight/kernels.o filcc/check.c -o preflight/check
          preflight/check
          for kind in null short freed; do
            if preflight/check "$kind" >"preflight/check-$kind.log" 2>&1; then exit 1; fi
            grep -i 'safety error' "preflight/check-$kind.log"
          done
          "$stock" -O3 -pthread preflight/kernels.o preflight/regress.o -o preflight/regress
          timeout 60s preflight/regress
      - name: Benchmark the same pass via IR replay
        run: |
          stock="$RUNNER_TEMP/stock/build/bin/clang"
          awk 'NR == 1 {next} /^Here.s the pizlonated module/ {exit} {print}' \
            preflight/trace-kernels.log >preflight/replay-kernels.ll
          cat >preflight/filcc-replay <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          root=$(cd "$(dirname "$0")" && pwd)
          replay="$root/replay-kernels.ll"
          args=()
          for arg in "$@"; do
            if [[ "$arg" == -filcc-batch-reads ]]; then
              unset 'args[-1]'
              replay="$root/filc-kernels.ll"
            else
              args+=("$arg")
            fi
          done
          for i in "${!args[@]}"; do
            if [[ "${args[i]}" == */kernels.c ]]; then args[i]="$replay"; fi
          done
          exec "$STOCK_FILC" "${args[@]}"
          EOF
          chmod +x preflight/filcc-replay
          export STOCK_FILC="$stock"
          sed -i 's/filcc.batch.guard/filcc.batch:/g' filcc/bench.py
          python3 filcc/bench.py --stock "$stock" --filcc "$PWD/preflight/filcc-replay" --out replay-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-benchmark-results
          path: |
            replay-results/*.json
            replay-results/*.ll
            replay-results/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-rewrite-preflight
          path: preflight/*.ll
